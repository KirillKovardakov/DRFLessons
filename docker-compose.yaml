
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drf_web
    command: >
      sh -c "
      python manage.py migrate --no-input&&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: drf_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}

  redis:
    image: redis:7
    container_name: drf_redis

  celery:
    build: .
    container_name: drf_celery
    command: celery -A config worker -l info -P solo
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    container_name: drf_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - web
volumes:
  postgres_data:
